name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job per gate, matching the main omnidiff repository, so a red badge says which gate broke
# without opening the log.
jobs:
  compile:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -p ./ --noEmit

  lint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is what VS Code 1.85 ships as its extension host, 20 is what newer builds use, and
        # 22 is where they are going. All three have to work, because the extension runs on
        # whichever the user's VS Code has.
        #
        # 22 is here for a second reason: `node --test <directory>` stopped meaning "every test
        # file under here" and started meaning "run this path as a file", so the test script has
        # to name the files. On [18, 20] alone that regression was invisible.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `src/test/integration.test.ts` skips itself here: omnidiff is not installed, and building
      # it would add minutes of Rust compilation to every run for one assertion the unit tests
      # already cover except for the spawn.
      - run: npm test

  # Only the target-less fallback VSIX is built here. The five platform-specific ones need a
  # omnidiff release to download from, which would make every pull request depend on a published
  # tag of another repository; they are built in release.yml, on a tag, where that dependency is
  # real anyway.
  package:
    name: vsce package (fallback, no binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 the other jobs use: @vscode/vsce declares `engines: node >= 22`. npm only
          # warns on an engine mismatch, so this ran on 20 and happened to work - vsce 4 calls
          # `util.styleText`, which recent 20.x carries. Depending on that is how a release job
          # breaks on the first vsce release that uses something 22 genuinely added.
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches a broken manifest, a missing file, or a .vscodeignore that excludes something the
      # extension needs - none of which tsc or the tests can see.
      - run: npx --yes @vscode/vsce package --out omnidiff.vsix

      # The fallback must carry NO binary: it is what the Marketplace serves to architectures with
      # no build, and those users are meant to fall through to PATH. A binary leaking into it would
      # be the wrong architecture for every one of them.
      - name: Fallback VSIX carries no binary
        run: |
          if unzip -Z1 omnidiff.vsix | grep -q '^extension/bin/'; then
            echo "::error::the target-less VSIX contains a bundled binary"
            unzip -Z1 omnidiff.vsix | grep '^extension/bin/'
            exit 1
          fi
          echo "confirmed: no extension/bin/ entries"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: omnidiff.vsix
